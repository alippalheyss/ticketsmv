<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0a0f1d" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="#0a0f1d" />
  <circle cx="256" cy="256" r="230" fill="url(#glow)" />
  <rect x="76" y="116" width="360" height="280" rx="36" fill="url(#oceanGrad)" stroke="#38bdf8" stroke-width="4" />
  <!-- Ticket Notch Left -->
  <circle cx="76" cy="256" r="32" fill="#0a0f1d" />
  <!-- Ticket Notch Right -->
  <circle cx="436" cy="256" r="32" fill="#0a0f1d" />
  <!-- Dashed divider -->
  <line x1="200" y1="136" x2="200" y2="376" stroke="#0a0f1d" stroke-width="6" stroke-dasharray="14 12" stroke-linecap="round" />
  <!-- Cinema Clapper / Film Reel Star -->
  <path d="M140 220 L160 220 L160 240 L140 240 Z" fill="#ffffff" opacity="0.9" />
  <circle cx="140" cy="290" r="22" fill="#ffffff" opacity="0.9" />
  <circle cx="140" cy="290" r="8" fill="#0f766e" />
  <!-- Play triangle -->
  <polygon points="280,210 370,256 280,302" fill="url(#goldGrad)" filter="drop-shadow(0px 4px 8px rgba(0,0,0,0.4))" />
  <!-- Sparkles -->
  <circle cx="360" cy="180" r="6" fill="#fef08a" />
  <circle cx="270" cy="330" r="4" fill="#fef08a" />
</svg>
